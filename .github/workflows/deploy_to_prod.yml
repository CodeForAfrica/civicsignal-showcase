name: deploy_to_prod
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: civicsignal-production
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/go.mod
          cache: false
      - name: Test deployment logic
        working-directory: deploy
        run: go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --prefix /tmp/cs-tests --no-save playwright@1.58.2
          /tmp/cs-tests/node_modules/.bin/playwright install --with-deps chromium
      - name: Build and validate the release
        env:
          NODE_PATH: /tmp/cs-tests/node_modules
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 -t "codeforafrica/civicsignal-web:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}" .
          docker run -d --name civicsignal-test -p 127.0.0.1:8088:8080 "codeforafrica/civicsignal-web:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8088/healthz; then break; fi
            sleep 2
          done
          node tests/local-smoke.cjs
          node tests/data-smoke.cjs
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Publish tested image
        id: publish
        run: |
          set -euo pipefail
          image="codeforafrica/civicsignal-web:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}"
          docker push "$image"
          digest=$(docker image inspect "$image" --format '{{index .RepoDigests 0}}')
          digest="${digest##*@}"
          [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Remove local test container
        if: always()
        run: docker rm -f civicsignal-test || true
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: deploy/go.mod
          cache: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: eu-west-1
          role-session-name: civicsignal-${{ github.run_id }}
          role-duration-seconds: 3600
      - name: Verify AWS account
        run: test "$(aws sts get-caller-identity --query Account --output text)" = "499665620971"
      - name: Deploy via constrained SSM document
        working-directory: deploy
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: go run ./cmd/deploy dispatch "$IMAGE_DIGEST"
      - name: Release summary
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          echo "Deployed codeforafrica/civicsignal-web@$IMAGE_DIGEST via AWS SSM. Portal and other apps were not targeted." >> "$GITHUB_STEP_SUMMARY"
